<!DOCTYPE html>
<html lang="en" data-theme="dark" data-font="sans" data-accent="indigo" data-size="md">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lexio — Vocabulary Trainer</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
</head>
<body>

<div id="app" class="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">Lx</div>
      <div class="brand-text">
        <strong>Lexio</strong>
        <span>Vocabulary Trainer</span>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item is-active" data-view="dashboard">
        <svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-item" data-view="decks">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v12"/></svg>
        <span>Decks</span>
      </button>
      <button class="nav-item" data-view="study">
        <svg viewBox="0 0 24 24"><path d="M12 21V7"/><path d="M12 7a4 4 0 0 0-4-4H3v14h5a4 4 0 0 1 4 4"/><path d="M12 7a4 4 0 0 1 4-4h5v14h-5a4 4 0 0 0-4 4"/></svg>
        <span>Study</span>
        <em class="nav-badge" id="navDue">0</em>
      </button>
      <button class="nav-item" data-view="practice">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1"/></svg>
        <span>Practice</span>
      </button>
      <button class="nav-item" data-view="browse">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <span>Browse</span>
      </button>
      <button class="nav-item" data-view="stats">
        <svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
        <span>Progress</span>
      </button>
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.5 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 2.6 7.5a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V7a1.6 1.6 0 0 0 1.5 1H23a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
        <span>Settings</span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <div class="streak-chip" title="Current study streak">
        <svg viewBox="0 0 24 24"><path d="M12 2s5 5 5 9a5 5 0 0 1-10 0c0-1.5.6-2.8 1.4-3.9"/><path d="M12 22a4 4 0 0 0 4-4c0-2-2-3-4-6-2 3-4 4-4 6a4 4 0 0 0 4 4z"/></svg>
        <span><b id="streakDays">0</b> day streak</span>
      </div>
      <button class="ghost-btn tiny" id="quickBackup">Save backup file</button>
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuToggle" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar-title">
        <h1 id="viewTitle">Dashboard</h1>
        <p id="viewSub">Your learning at a glance</p>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeQuick" title="Toggle light / dark">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="primary-btn" id="topStudyBtn">
          <svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg>
          <span>Start studying</span>
        </button>
      </div>
    </header>

    <div class="scroll-area" id="scrollArea" tabindex="0" role="region" aria-label="Page content">
      <section class="view" id="view-dashboard"></section>
      <section class="view hidden" id="view-decks"></section>
      <section class="view hidden" id="view-study"></section>
      <section class="view hidden" id="view-practice"></section>
      <section class="view hidden" id="view-browse"></section>
      <section class="view hidden" id="view-stats"></section>
      <section class="view hidden" id="view-settings"></section>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<!-- Modal host -->
<div class="modal-host hidden" id="modalHost">
  <div class="modal-backdrop" data-close="1"></div>
  <div class="modal" role="dialog" aria-modal="true">
    <header class="modal-head">
      <h3 id="modalTitle">Title</h3>
      <button class="icon-btn" data-close="1" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </header>
    <div class="modal-body" id="modalBody"></div>
    <footer class="modal-foot" id="modalFoot"></footer>
  </div>
</div>

<button class="to-top" id="toTop" aria-label="Back to top" title="Back to top">
  <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
</button>

<div class="toast-wrap" id="toastWrap"></div>

<script src="data.js"></script>
<script src="deck-b1.js"></script>
<script src="srs.js"></script>
<script src="storage.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
